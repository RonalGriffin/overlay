<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay Tasks PRO</title>

<style>

/* BASE */
html, body {
  width: 1080px;
  height: 1920px;
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* CONTENEDOR */
#app {
  width: 100%;
  position: absolute;
  top: 300px;
  left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* PANEL EDICIÓN (oculto por defecto) */
#setup {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  margin-bottom: 20px;
}

/* SOLO aparece con mouse real */
@media (hover: hover) {
  body:hover #setup {
    opacity: 1;
    pointer-events: auto;
  }
}

/* BOTONES */
button {
  background: #ffd000;
  border: none;
  padding: 16px;
  border-radius: 18px;
  cursor: pointer;
  font-weight: bold;
  margin: 6px;
  font-size: 24px;
}

/* INPUT */
input {
  width: 900px;
  margin-top: 10px;
  padding: 18px;
  border-radius: 16px;
  border: none;
  font-size: 28px;
  box-sizing: border-box;
}

/* TAREAS */
.task {
  width: 920px;
  min-height: 100px;

  background: #ffd000;
  margin-top: 20px;
  padding: 26px 30px;

  border-radius: 36px;

  font-size: 44px;
  font-weight: 800;

  display: flex;
  align-items: center;

  color: white;
  text-shadow: 0 3px 8px rgba(0,0,0,0.45);
  box-shadow: 0 10px 30px rgba(0,0,0,0.28);

  transition: all 0.45s ease;
}

/* ICONO */
.task::before {
  content: "";
  width: 46px;
  height: 46px;
  margin-right: 18px;

  background-image: url("estrella.png");
  background-size: contain;
  background-repeat: no-repeat;
}

/* ESCALONADO */
.task.level-0 {
  opacity: 1;
  transform: scale(1);
}

.task.level-1 {
  opacity: 0.75;
  transform: scale(0.92);
}

.task.level-2 {
  opacity: 0.55;
  transform: scale(0.85);
}

/* COMPLETAR */
.task.done {
  opacity: 0;
  transform: translateX(400px);
}

/* SUBIDA */
.task.move-up {
  transform: translateY(-50px);
}

</style>
</head>

<body>

<div id="app">

  <!-- PANEL QUE SOLO APARECE CON MOUSE -->
  <div id="setup">
    <div>
      <button onclick="crearInputs(1)">1</button>
      <button onclick="crearInputs(2)">2</button>
      <button onclick="crearInputs(3)">3</button>
    </div>

    <div id="inputs"></div>
  </div>

  <!-- TAREAS SIEMPRE VISIBLES -->
  <div id="tasks"></div>

</div>

<script>

let tareas = [];

/* INPUTS */
function crearInputs(num) {
  const cont = document.getElementById("inputs");
  cont.innerHTML = "";

  for (let i = 0; i < num; i++) {
    cont.innerHTML += `<input placeholder="Tarea ${i+1}" id="t${i}">`;
  }

  cont.innerHTML += `<button onclick="crearTareas(${num})">Crear</button>`;
}

/* CREAR */
function crearTareas(num) {
  tareas = [];

  for (let i = 0; i < num; i++) {
    const texto = document.getElementById("t"+i).value;
    if (texto.trim() !== "") tareas.push(texto);
  }

  render();
}

/* RENDER */
function render() {
  const tasksDiv = document.getElementById("tasks");
  tasksDiv.innerHTML = "";

  tareas.forEach((t, i) => {

    let level = "level-0";
    if (i === 1) level = "level-1";
    if (i === 2) level = "level-2";

    const div = document.createElement("div");
    div.className = `task ${level}`;
    div.textContent = t;

    div.onclick = () => completar(i, div);

    tasksDiv.appendChild(div);
  });
}

/* COMPLETAR */
function completar(index, elemento) {
  elemento.classList.add("done");

  setTimeout(() => {
    tareas.splice(index, 1);
    animarSubida();
    render();
  }, 450);
}

/* ANIMACIÓN */
function animarSubida() {
  const items = document.querySelectorAll(".task");

  items.forEach(el => {
    el.classList.add("move-up");
    setTimeout(() => el.classList.remove("move-up"), 320);
  });
}

</script>

</body>
</html>
