<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay Tasks PRO</title>

<style>
html, body {
  width: 1080px;
  height: 1920px;
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#app {
  width: 100%;
  position: absolute;
  top: 300px;
  left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#modoBtn {
  opacity: 0;
  transition: opacity 0.3s ease;
  position: absolute;
  top: -70px;
  background: black;
  color: white;
  padding: 12px 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-size: 22px;
}

body:hover #modoBtn {
  opacity: 1;
}

#setup {
  margin-bottom: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

button {
  background: #ffd000;
  border: none;
  padding: 16px 18px;
  border-radius: 18px;
  cursor: pointer;
  font-weight: bold;
  margin: 6px;
  font-size: 24px;
}

input {
  width: 900px;
  margin-top: 12px;
  padding: 18px;
  border-radius: 16px;
  border: none;
  font-size: 28px;
  box-sizing: border-box;
}

/* TAREAS GRANDES DE VERDAD */
.task {
  width: 920px;
  min-height: 96px;
  box-sizing: border-box;

  background: #ffd000;
  margin-top: 22px;
  padding: 24px 30px;

  border-radius: 34px;

  font-size: 42px;
  font-weight: 800;
  line-height: 1.15;

  display: flex;
  align-items: center;

  color: white;
  text-shadow: 0 3px 8px rgba(0,0,0,0.45);
  box-shadow: 0 10px 30px rgba(0,0,0,0.28);

  transition: all 0.45s ease;
}

/* estrella con tu imagen */
.task::before {
  content: "";
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  margin-right: 16px;
  background-image: url("estrella.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

/* escalonado */
.task.level-0 {
  opacity: 1;
  transform: scale(1);
}

.task.level-1 {
  opacity: 0.78;
  transform: scale(0.93);
}

.task.level-2 {
  opacity: 0.58;
  transform: scale(0.86);
}

.task.done {
  opacity: 0;
  transform: translateX(340px);
}

.task.move-up {
  transform: translateY(-48px);
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div id="app">
  <button id="modoBtn" onclick="toggleModo()">Modo Overlay</button>

  <div id="setup">
    <div>
      <button onclick="crearInputs(1)">1</button>
      <button onclick="crearInputs(2)">2</button>
      <button onclick="crearInputs(3)">3</button>
    </div>
    <div id="inputs"></div>
  </div>

  <div id="tasks"></div>
</div>

<script>
let tareas = [];
let modoOverlay = false;

function toggleModo() {
  modoOverlay = !modoOverlay;

  const setup = document.getElementById("setup");
  const btn = document.getElementById("modoBtn");

  if (modoOverlay) {
    setup.classList.add("hidden");
    btn.textContent = "Modo Edición";
  } else {
    setup.classList.remove("hidden");
    btn.textContent = "Modo Overlay";
  }
}

function crearInputs(num) {
  const cont = document.getElementById("inputs");
  cont.innerHTML = "";

  for (let i = 0; i < num; i++) {
    cont.innerHTML += `<input placeholder="Tarea ${i + 1}" id="t${i}">`;
  }

  cont.innerHTML += `<button onclick="crearTareas(${num})">Crear</button>`;
}

function crearTareas(num) {
  tareas = [];

  for (let i = 0; i < num; i++) {
    const texto = document.getElementById("t" + i).value;
    if (texto.trim() !== "") tareas.push(texto);
  }

  render();
}

function render() {
  const tasksDiv = document.getElementById("tasks");
  tasksDiv.innerHTML = "";

  tareas.forEach((t, i) => {
    let level = "level-0";
    if (i === 1) level = "level-1";
    if (i === 2) level = "level-2";

    const div = document.createElement("div");
    div.className = `task ${level}`;
    div.textContent = t;
    div.onclick = () => completar(i, div);
    tasksDiv.appendChild(div);
  });
}

function completar(index, elemento) {
  elemento.classList.add("done");

  setTimeout(() => {
    tareas.splice(index, 1);
    animarSubida();
    render();
  }, 450);
}

function animarSubida() {
  const items = document.querySelectorAll(".task");

  items.forEach(el => {
    el.classList.add("move-up");
    setTimeout(() => el.classList.remove("move-up"), 320);
  });
}
</script>

</body>
</html>
