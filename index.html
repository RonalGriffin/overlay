<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay Tasks PRO</title>

<style>

/* TAMAÑO REAL DEL OVERLAY (CLAVE PARA NO PIXELAR) */
html, body {
  width: 1080px;
  height: 1920px;
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* CONTENEDOR */
#app {
  width: 900px;
  position: absolute;
  top: 350px;
  left: 50px;
}

/* BOTÓN OCULTO */
#modoBtn {
  opacity: 0;
  transition: opacity 0.3s ease;
  position: absolute;
  top: -50px;
  left: 0;
  background: black;
  color: white;
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

body:hover #modoBtn {
  opacity: 1;
}

/* CONFIG */
#setup {
  margin-bottom: 20px;
}

/* BOTONES */
button {
  background: #ffd000;
  border: none;
  padding: 12px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: bold;
  margin: 5px 5px 0 0;
}

/* INPUT */
input {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 18px;
}

/* TAREAS */
.task {
  background: #ffd000;
  margin-top: 15px;
  padding: 20px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  font-weight: bold;
  font-size: 28px;
  color: white;
  text-shadow: 0 3px 8px rgba(0,0,0,0.5);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  transition: all 0.4s ease;
}

/* ICONO IMAGEN */
.task::before {
  content: "";
  width: 28px;
  height: 28px;
  margin-right: 12px;

  background-image: url("estrella.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

/* ESCALONADO */
.task.level-0 {
  opacity: 1;
  transform: scale(1);
}

.task.level-1 {
  opacity: 0.7;
  transform: scale(0.92);
}

.task.level-2 {
  opacity: 0.5;
  transform: scale(0.85);
}

/* COMPLETAR */
.task.done {
  opacity: 0;
  transform: translateX(200px);
}

/* SUBIDA */
.task.move-up {
  transform: translateY(-40px);
}

/* OCULTO */
.hidden {
  display: none;
}

</style>
</head>

<body>

<div id="app">

  <button id="modoBtn" onclick="toggleModo()">Modo Overlay</button>

  <div id="setup">
    <div>
      <button onclick="crearInputs(1)">1</button>
      <button onclick="crearInputs(2)">2</button>
      <button onclick="crearInputs(3)">3</button>
    </div>

    <div id="inputs"></div>
  </div>

  <div id="tasks"></div>

</div>

<script>

let tareas = [];
let modoOverlay = false;

/* MODO */
function toggleModo() {
  modoOverlay = !modoOverlay;

  const setup = document.getElementById("setup");
  const btn = document.getElementById("modoBtn");

  if (modoOverlay) {
    setup.classList.add("hidden");
    btn.textContent = "Modo Edición";
  } else {
    setup.classList.remove("hidden");
    btn.textContent = "Modo Overlay";
  }
}

/* INPUTS */
function crearInputs(num) {
  const cont = document.getElementById("inputs");
  cont.innerHTML = "";

  for (let i = 0; i < num; i++) {
    cont.innerHTML += `<input placeholder="Tarea ${i+1}" id="t${i}">`;
  }

  cont.innerHTML += `<button onclick="crearTareas(${num})">Crear</button>`;
}

/* CREAR */
function crearTareas(num) {
  tareas = [];

  for (let i = 0; i < num; i++) {
    const texto = document.getElementById("t"+i).value;
    if (texto.trim() === "") continue;
    tareas.push(texto);
  }

  render();
}

/* RENDER */
function render() {
  const tasksDiv = document.getElementById("tasks");
  tasksDiv.innerHTML = "";

  tareas.forEach((t, i) => {

    let level = "level-0";
    if (i === 1) level = "level-1";
    if (i === 2) level = "level-2";

    const div = document.createElement("div");
    div.className = `task ${level}`;
    div.innerHTML = t;

    div.onclick = () => completar(i, div);

    tasksDiv.appendChild(div);
  });
}

/* COMPLETAR */
function completar(index, elemento) {
  elemento.classList.add("done");

  setTimeout(() => {
    tareas.splice(index, 1);
    animarSubida();
    render();
  }, 400);
}

/* ANIMACIÓN */
function animarSubida() {
  const items = document.querySelectorAll(".task");

  items.forEach(el => {
    el.classList.add("move-up");
    setTimeout(() => el.classList.remove("move-up"), 300);
  });
}

</script>

</body>
</html>
